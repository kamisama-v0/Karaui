# Check, build the Docker image on GitHub, push it to GHCR, then deploy it to the
# VPS over SSH. The VPS only pulls and restarts (/opt/infrastructure/scripts/deploy.sh).
#
# Repo secrets: VPS_HOST (server address), VPS_SSH_KEY (private half of a
# dedicated deploy key whose authorized_keys entry is pinned to deploy-gate.sh).
# Optional repo variable: NEXT_PUBLIC_GOOGLE_ANALYTICS_ID.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kamisama-v0/karaui

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check

  build:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # One plain manifest per version, so pruning old versions below can
          # never delete a child of an image that is still tagged.
          provenance: false
          build-args: |
            NEXT_PUBLIC_GOOGLE_ANALYTICS_ID=${{ vars.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://karaui.kamisama-v0.my.id
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          # Pinned host key, so a spoofed server can't receive the deploy.
          echo "$HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMLBYKg0NXmWsoHL7SrX7q9iIaYWAeadnEpWTMjEoNWu" > ~/.ssh/known_hosts
          # The key's authorized_keys entry forces deploy-gate.sh; the tag is all it reads.
          ssh -i ~/.ssh/deploy_key root@"$HOST" "$TAG"
      # Keep the last 10 images for deploy.sh --rollback; GHCR storage stays small.
      - name: Prune old images
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: karaui
          package-type: container
          min-versions-to-keep: 10
