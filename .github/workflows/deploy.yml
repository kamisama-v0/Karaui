# Deploy karaUI to the home server — same flow as kamisama-v0/kamisama-v0.
# Runs on the org self-hosted runner (labels: self-hosted, kamisama).
#
# Three settings, never hardcoded here:
#   1. vars.LIVE_PORT      — GitHub Variable. kamisama-deploy.sh derives
#      COPY=LIVE-500 and FRONT=3000+(LIVE-5000).
#   2. secrets.ENV_FILE    — GitHub Secret holding the whole production .env.
#   3. vars.PRODUCTION_URL — GitHub Variable, full public URL. Overrides
#      NEXT_PUBLIC_SITE_URL in .env and registers the subdomain.
#
# Push-only on purpose: the repo is public and the runner is a real machine,
# so fork pull requests must never reach it.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-karaui
  cancel-in-progress: false

env:
  APP: karaui
  IMAGE: kamisama/karaui

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Typecheck, lint and validate registry
        run: bun run check
      # The live-registry test needs the site that this workflow deploys, so it
      # runs after the deploy instead (see "Smoke test").
      - name: Tests
        run: bun test --test-name-pattern '^(?!.*production registry\.json).*$'

  build-and-deploy:
    needs: check
    runs-on: [self-hosted, kamisama]
    steps:
      - uses: actions/checkout@v4

      - name: Generate .env from secrets
        # Secrets go through env:, not ${{ }} interpolation, so quotes, spaces
        # and $ inside values are never parsed by the shell.
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          LIVE_PORT: ${{ vars.LIVE_PORT }}
        run: |
          test -n "$PRODUCTION_URL" || { echo "vars.PRODUCTION_URL is not set"; exit 1; }
          test -n "$LIVE_PORT" || { echo "vars.LIVE_PORT is not set"; exit 1; }
          printf "%s\n" "$ENV_FILE" > .env
          # PRODUCTION_URL is the single source of truth for the public origin.
          grep -v -E "^(NEXT_PUBLIC_SITE_URL|PRODUCTION_URL)=" .env > .env.tmp || true
          mv .env.tmp .env
          printf "NEXT_PUBLIC_SITE_URL=%s\nPRODUCTION_URL=%s\n" "$PRODUCTION_URL" "$PRODUCTION_URL" >> .env
          chmod 600 .env

      - name: Build image (local, no registry)
        run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Blue-green deploy (nginx flip, zero downtime)
        run: ~/bin/kamisama-deploy.sh "$APP" "${{ vars.LIVE_PORT }}" "$IMAGE:${{ github.sha }}"

      - name: Register subdomain (route DNS first, idempotent)
        run: |
          HOST=$(echo "${{ vars.PRODUCTION_URL }}" | sed -e 's|https://||' -e 's|http://||' -e 's|/.*||')
          FRONT=$((3000 + ${{ vars.LIVE_PORT }} - 5000))
          ~/bin/kamisama-subdomain.sh "$HOST" "http://localhost:$FRONT"

      - name: Smoke test
        run: |
          URL="${{ vars.PRODUCTION_URL }}"
          for path in /health /r/registry.json; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$URL$path" || echo 000)
            echo "$URL$path -> $code"
          done
          curl -fsS --max-time 20 "$URL/r/registry.json" > /dev/null

      - name: Prune dangling images
        if: always()
        run: docker image prune -f
