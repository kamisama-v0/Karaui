name: CI

# Vercel builds and deploys; this workflow only gates main and pull requests.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and validate registry
        run: bun run check

      # The production registry.json test fetches the live site, which can lag
      # behind the commit being checked, so it is skipped here.
      - name: Tests
        run: bun test --test-name-pattern '^(?!.*production registry\.json).*$'
